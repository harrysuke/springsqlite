name: Docker Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: harrysuke/springsqliteMyBatis

# Cancel superseded runs for the same ref so rapid pushes do not spawn
# overlapping multi-arch builds.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and run tests
        run: ./gradlew clean build --no-daemon

  docker:
    name: Build and push image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        id: gradle-cache
        with:
          path: gradle-cache-mount
          key: gradle-cache-mount-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts') }}
          restore-keys: |
            gradle-cache-mount-${{ runner.os }}-

      # BuildKit does not export `RUN --mount=type=cache` contents through
      # --cache-to, so on a fresh CI runner the Gradle cache mount always
      # starts empty. This action injects the saved cache into the mount
      # before the build and extracts it again afterwards.
      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: gradle-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.gradle-cache.outputs.cache-hit }}

      - name: Log in to Docker Hub
        # Pull requests (including those from forks) never push, and fork PRs
        # have no access to repository secrets, so skip the login there.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error keeps a flaky cache export from failing the whole
          # publish job (the image itself is already built and pushed).
          cache-to: type=gha,mode=max,ignore-error=true
